name: Documentation checks

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - name: Install documentation tooling
        run: python -m pip install -r requirements-docs.txt
      - name: Test the documentation checker
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Test image tag policy
        run: node --test scripts/test_image_tags.cjs
      - name: Check documentation links and examples
        run: python scripts/check_docs.py
