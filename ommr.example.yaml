# Copy to ommr.yaml, chmod 600 ommr.yaml, and set OMMR_CONFIG_FILE=ommr.yaml.
# Environment variables override these values. Prefer environment secrets.
port: 8080
provider_timeout: 10s
apple_storefront: us
cache_ttl: 24h
enable_enrichment: true
metadata_policy: '{"mode":"consensus"}'
lastfm_api_key: ""
discogs_token: ""
acoustid_api_key: ""
